server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;

    # Only add_header at server level: any add_header inside a location would drop these.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;  # set by your TLS terminator
        proxy_read_timeout 60s;  # AI drafting can take ~40s
    }
    location /assets/ { expires 1y; }                 # hashed file names: cache forever
    location / { expires -1; try_files $uri /index.html; }  # SPA routes like /set-password
}
