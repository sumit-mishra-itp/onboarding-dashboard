# Hosting: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Put HTTPS in front of port 80 (load balancer, Caddy, Cloudflare...): session cookies are Secure-only.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: eod
    volumes: [pgdata:/var/lib/postgresql/data]  # back this volume up
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eod"]
      interval: 5s
      retries: 30

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}  # only set false to try the stack over plain http locally
      DATABASE_URL: postgresql://eod:${POSTGRES_PASSWORD}@db:5432/eod
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_MODEL: ${AI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ./web, target: prod }
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on: [api]

volumes:
  pgdata:
